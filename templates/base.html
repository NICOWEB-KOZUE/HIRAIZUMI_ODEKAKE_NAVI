<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ひらいずみ おでかけナビ{% endblock %}</title>
  <link rel="icon" href="{{ static_url('favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
  {% include "_soft_bg.html" %}
  <header class="app-header">
    <a class="app-name" href="{{ url_for('index') }}">
      <img class="app-logo" src="{{ static_url('logo-mark.png') }}" alt="">
      <span class="app-title"><span class="nowrap">ひらいずみ</span> <span class="nowrap">おでかけナビ</span></span>
    </a>
    {% block back %}{% endblock %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  {% block footer_dog %}
  <footer class="dog-footer" aria-hidden="true">
    {% include "_scenery.html" %}
    <button type="button" class="footer-dog" tabindex="-1">{% include "_couple.html" %}</button>
  </footer>
  {% endblock %}

  <script src="{{ static_url('app.js') }}"></script>
</body>
</html>
