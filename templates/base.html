<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ひらいずみ おでかけナビ{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}?v=4" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <a class="app-name" href="{{ url_for('index') }}">
      <img class="app-logo" src="{{ url_for('static', filename='logo-mark.png') }}?v=2" alt="">
      ひらいずみ おでかけナビ
    </a>
    {% block back %}{% endblock %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  {% block footer_dog %}
  <footer class="dog-footer" aria-hidden="true">
    <svg class="scenery" viewBox="0 0 1200 100" preserveAspectRatio="xMidYMax slice">
      <ellipse cx="300" cy="22" rx="34" ry="8" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="322" cy="16" rx="20" ry="8" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="860" cy="26" rx="40" ry="8" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="884" cy="19" rx="22" ry="8" fill="#ffffff" opacity="0.9"/>

      <!-- 遠くの山なみ -->
      <path d="M0 70 C120 48 240 46 360 60 C450 70 520 50 600 46 C700 42 800 58 880 56 C980 52 1100 64 1200 58 L1200 100 L0 100Z" fill="#d6e8d6"/>
      <!-- 金鶏山 -->
      <path d="M585 88 Q615 38 645 88Z" fill="#bcd9bf"/>

      <!-- 中尊寺: 杉の丘と本堂、金色堂 -->
      <path d="M396 92 C422 62 468 50 518 50 C566 50 588 70 604 92Z" fill="#a6cf98"/>
      <path d="M414 80 L421 54 L428 80Z M426 80 L433 50 L440 80Z M438 80 L445 56 L452 80Z" fill="#4f7f4a"/>
      <rect x="470" y="40" width="30" height="12" fill="#7a4a2c"/>
      <path d="M460 42 Q472 40 478 30 L492 30 Q498 40 510 42Z" fill="#3f3f46"/>
      <rect x="476" y="27" width="18" height="3" rx="1" fill="#3f3f46"/>
      <rect x="524" y="44" width="18" height="8" fill="#e0b23a"/>
      <path d="M519 45 Q527 42 533 35 Q539 42 547 45Z" fill="#c9951c"/>
      <text x="486" y="20" text-anchor="middle" class="scenery-label">中尊寺</text>

      <!-- 毛越寺: 本堂と大泉が池 -->
      <rect x="642" y="72" width="36" height="13" fill="#7a4a2c"/>
      <path d="M632 74 Q646 72 652 62 L668 62 Q674 72 688 74Z" fill="#3f3f46"/>
      <rect x="650" y="59" width="20" height="3" rx="1" fill="#3f3f46"/>
      <text x="660" y="52" text-anchor="middle" class="scenery-label">毛越寺</text>

      <path d="M0 88 C200 84 400 90 600 87 C800 84 1000 90 1200 86 L1200 100 L0 100Z" fill="#b4d79a"/>
      <ellipse cx="660" cy="93" rx="56" ry="5" fill="#8fc8e6"/>
      <ellipse cx="612" cy="92" rx="6" ry="3" fill="#9a9a8f"/>
    </svg>
    <button type="button" class="footer-dog" tabindex="-1">🐕</button>
  </footer>
  {% endblock %}

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
