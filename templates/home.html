{% extends "base.html" %}
{% from "_icons.html" import icon %}

{% block content %}
<form action="{{ url_for('places') }}" method="get">
  <h2 class="subtitle">どこから出かけますか？</h2>
  <input type="hidden" name="origin" value="home">
  <div class="departure">
    <p class="home-origin">{% if stop %}自宅（バス停：{{ stop }}）{% else %}自宅{% endif %}</p>
    <a class="change-stop" href="{{ url_for('stop') }}">バス停を変更する</a>
  </div>

  <h1 class="title">どこへ行きたいですか？</h1>
  <div class="button-list">
    {% for c in categories %}
      <button class="big-button category-button" type="submit" name="category" value="{{ c.id }}">
        <span class="icon">{{ icon(c.id) }}</span><span>{{ c.label }}</span>
      </button>
    {% endfor %}
  </div>
</form>
{% endblock %}
